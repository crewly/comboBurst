name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - target: win
        - target: mac
        - target: ios
        - target: android32
        - target: android64

    name: Build ${{ matrix.config.target }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: geode-sdk/build-geode-mod-docker@v1
        with:
          target: ${{ matrix.config.target }}
          # osxcross' lipo can't merge LTO bitcode for universal mac builds
          use-lto: ${{ matrix.config.target != 'mac' }}
          upload: true

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod-docker/merge@v1
        with:
          upload: true
    